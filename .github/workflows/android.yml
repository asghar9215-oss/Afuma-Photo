Name: Build Android Master Webview App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام درج کریں'
        required: true
        default: 'Ji Bhai Khata'
      package_name:
        description: 'پیکیج کا نام (com.example.app)'
        required: true
        default: 'com.stylelink.jibhaikhata'
      version_code:
        description: 'ورژن کوڈ لکھیں'
        required: true
        default: '10025'
      version_name:
        description: 'ورژن کا نام لکھیں'
        required: true
        default: '1.0.25'
      blogger_url:
        description: 'اپنے بلاگر یا ایپ کا لائیو لنک یہاں پیسٹ کریں'
        required: true
        default: 'https://dakansling.blogspot.com/?m=1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Android Project Directory
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"

      - name: Download Custom App Image Icon
        run: |
          curl -s -L "https://i.ibb.co/jPgwbSDq/74074.png" -o app/src/main/res/drawable/ic_launcher.png

      - name: Generate Android Native Java Source Code
        run: |
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')

          # Firebase Messaging Service for Background FCM Notifications
          cat << 'EOF' > "app/src/main/java/$PKG_PATH/MyFirebaseMessagingService.java"
          package ${{ github.event.inputs.package_name }};

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFirebaseMessagingService extends FirebaseMessagingService {

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);

                  String title = "💦 جی بھائی کھاتا - اہم الرٹ 💦";
                  String body = "محترم صارف! اپنا حساب کتاب اپڈیٹ کریں۔ ابھی ایپ کھولیں!";

                  if (remoteMessage.getNotification() != null) {
                      if (remoteMessage.getNotification().getTitle() != null) {
                          title = remoteMessage.getNotification().getTitle();
                      }
                      if (remoteMessage.getNotification().getBody() != null) {
                          body = remoteMessage.getNotification().getBody();
                      }
                  } else if (remoteMessage.getData().size() > 0) {
                      if (remoteMessage.getData().containsKey("title")) {
                          title = remoteMessage.getData().get("title");
                      }
                      if (remoteMessage.getData().containsKey("body")) {
                          body = remoteMessage.getData().get("body");
                      }
                  }

                  showNotification(title, body);
              }

              private void showNotification(String title, String message) {
                  String channelId = "ji_bhai_khata_fcm_alerts";
                  NotificationManager notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              channelId,
                              "Ji Bhai Khata Alerts",
                              NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.enableVibration(true);
                      if (notificationManager != null) {
                          notificationManager.createNotificationChannel(channel);
                      }
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Uri defaultSoundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, channelId)
                          .setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setContentTitle(title)
                          .setContentText(message)
                          .setAutoCancel(true)
                          .setSound(defaultSoundUri)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setContentIntent(pendingIntent);

                  if (notificationManager != null) {
                      notificationManager.notify((int) System.currentTimeMillis(), builder.build());
                  }
              }
          }
          EOF

          # MainActivity Source Code
          cat << 'EOF' > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package ${{ github.event.inputs.package_name }};

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.URLUtil;
          import android.webkit.PermissionRequest;
          import android.os.Build;
          import android.os.Environment;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.widget.Toast;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {
              private WebView myWebView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(new String[]{
                              "android.permission.ACCESS_FINE_LOCATION",
                              "android.permission.ACCESS_COARSE_LOCATION",
                              "android.permission.CAMERA",
                              "android.permission.RECORD_AUDIO",
                              "android.permission.MODIFY_AUDIO_SETTINGS",
                              "android.permission.WRITE_EXTERNAL_STORAGE",
                              "android.permission.READ_EXTERNAL_STORAGE",
                              "android.permission.POST_NOTIFICATIONS"
                      }, 1);
                  }

                  // Subscribe to FCM topic for global push alerts
                  FirebaseMessaging.getInstance().subscribeToTopic("all_users");

                  myWebView = new WebView(this);
                  WebSettings webSettings = myWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setGeolocationEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);

                  myWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url == null) return false;
                          
                          if (url.startsWith("tel:")) {
                              Intent intent = new Intent(Intent.ACTION_DIAL, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                          
                          if (url.startsWith("whatsapp:") || url.contains("api.whatsapp.com") || url.contains("wa.me")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "موبائل میں واٹس ایپ انسٹال نہیں ہے!", Toast.LENGTH_SHORT).show();
                                  return true;
                              }
                          }

                          if (url.contains("maps.google.com") || url.startsWith("geo:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "گوگل میپس ایپ نہیں ملی!", Toast.LENGTH_SHORT).show();
                                  return true;
                              }
                          }

                          if (url.startsWith("blob:") || url.endsWith(".pdf") || url.contains("export=pdf")) {
                              createWebPrintJob(view);
                              return true;
                          }

                          return false;
                      }
                  });

                  myWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                          }
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  myWebView.setDownloadListener((downloadUrl, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          if (downloadUrl.startsWith("blob:")) {
                              createWebPrintJob(myWebView);
                              return;
                          }
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(downloadUrl));
                          request.setMimeType(mimeType != null ? mimeType : "application/pdf");
                          request.setDescription("فائل ڈاؤن لوڈ ہو رہی ہے...");
                          request.setTitle(URLUtil.guessFileName(downloadUrl, contentDisposition, mimeType));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(downloadUrl, contentDisposition, mimeType));
                          
                          DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.enqueue(request);
                              Toast.makeText(MainActivity.this, "📄 فائل ڈاؤن لوڈ ہو رہی ہے...", Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception e) {
                          createWebPrintJob(myWebView);
                      }
                  });

                  myWebView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void printPage() {
                          runOnUiThread(() -> createWebPrintJob(myWebView));
                      }
                  }, "AndroidNativeBridge");

                  myWebView.loadUrl("${{ github.event.inputs.blogger_url }}");
                  setContentView(myWebView);
              }

              private void createWebPrintJob(WebView webView) {
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {
                      PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);
                      String jobName = "Ji_Bhai_Khata_PDF_Report";
                      PrintDocumentAdapter printAdapter = webView.createPrintDocumentAdapter(jobName);
                      if (printManager != null) {
                          printManager.print(jobName, printAdapter, new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (myWebView.canGoBack()) {
                      myWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate Android Manifest File
        run: |
          cat << EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MyFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

      - name: Generate Permanent Keystore and Cert
        run: |
          keytool -genkey -v -keystore app/jibhaikhata_master.keystore -alias "${{ secrets.KEY_ALIAS }}" -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" -dname "CN=StyleLink, OU=App, O=jibhaikhata, L=Lahore, S=Punjab, C=PK"
          keytool -export -rfc -keystore app/jibhaikhata_master.keystore -alias "${{ secrets.KEY_ALIAS }}" -file app/upload_certificate.pem -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Generate Build Gradle Configuration
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { 
              repositories { 
                  google()
                  mavenCentral()
                  gradlePluginPortal() 
              } 
          }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { 
                  google()
                  mavenCentral() 
              } 
          }
          rootProject.name = "stylelink-jibhaikhata"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript { 
              repositories { 
                  google()
                  mavenCentral() 
              }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'com.google.gms:google-services:4.4.1'
              } 
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { 
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace "${{ github.event.inputs.package_name }}"
              compileSdk 36
              signingConfigs { 
                  release { 
                      storeFile file("jibhaikhata_master.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  } 
              }
              
              defaultConfig { 
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdk 24
                  targetSdk 36
                  versionCode ${{ github.event.inputs.version_code }}
                  versionName "${{ github.event.inputs.version_name }}"
              }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
          }
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:32.8.0')
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'androidx.work:work-runtime:2.9.0'
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties

      - name: Build Official Signed AAB and APK Files
        run: |
          export GRADLE_USER_HOME=$HOME/.gradle_clean
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:bundleRelease :app:assembleRelease --no-build-cache

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jibhaikhata_Final_Release_Files
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/upload_certificate.pem
